services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        cp /data/keyfile/mongodb.key /tmp/mongodb.key
        chmod 400 /tmp/mongodb.key
        chown mongodb:mongodb /tmp/mongodb.key
        exec mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb.key
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongo_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb.key:/data/keyfile/mongodb.key:ro
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend

  backend:
    build: .
    container_name: backend-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: "mongodb://root:example@mongodb:27017/much_todo_db?authSource=admin&replicaSet=rs0"
      DB_NAME: "much_todo_db"
      JWT_SECRET_KEY: "your-super-secret-key-that-is-long-and-random"
      JWT_EXPIRATION_HOURS: "72"
      LOG_LEVEL: "DEBUG"
      LOG_FORMAT: "json"
      ENABLE_CACHE: "true"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  redis:
    image: redis:7.2
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend

  mongo-express:
    image: mongo-express:1.0.2
    container_name: mongo-express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://root:example@mongodb:27017/?authSource=admin&replicaSet=rs0&directConnection=true"
    networks:
      - backend

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379"
    networks:
      - backend

volumes:
  mongo_data:
  mongodb_config:
  redis_data:

networks:
  backend:
    driver: bridge
